name: CI

on:
  push:
    branches: [yolo]
  pull_request:
    branches: [yolo]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            name: linux-x86_64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            name: linux-aarch64
          - runner: macos-latest
            system: aarch64-darwin
            name: macos-aarch64

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main
        timeout-minutes: 5
        continue-on-error: true

      - name: Build
        # Use the Nix flake (matches Garnix). The apt-based path can't
        # reproduce the libjpeg-turbo + openjpeg + vendored charls
        # plumbing (pkgsStatic + -Dlibjpeg-include / -Dopenjpeg-include /
        # -Dcharls-src) that the flake bakes in. Reshaped to dogfood the
        # flake instead of maintaining a parallel apt build.
        run: nix build .#packages.${{ matrix.system }}.default -L

      - name: Test
        run: nix build .#checks.${{ matrix.system }}.test -L
